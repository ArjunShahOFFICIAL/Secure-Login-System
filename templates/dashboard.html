<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            color: red;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Welcome, {{ user }}!</h1>

        <p>You are logged in securely.</p>

        <a href="/logout">Logout</a>
    </div>

</body>
</html>
