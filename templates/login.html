<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        form {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <form method="POST">
        <h2>Login</h2>

        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

        <p>Don't have an account?</p>
        <a href="/register">Register Here</a>
    </form>

</body>
</html>
